name: Publish to PyPI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Generate CalVer
        id: version
        run: |
          python - <<'PYVERSION'
          import datetime
          import json
          import urllib.error
          import urllib.request

          package = "mcp-digitalhuman"
          today = datetime.datetime.now(datetime.timezone.utc).date()
          prefix = f"{today.year}.{today.month}.{today.day}."
          try:
              with urllib.request.urlopen(
                  f"https://pypi.org/pypi/{package}/json", timeout=10
              ) as response:
                  releases = json.load(response).get("releases", {})
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              releases = {}
          versions = [
              int(version.removeprefix(prefix))
              for version in releases
              if version.startswith(prefix)
              and version.removeprefix(prefix).isdigit()
          ]
          version = f"{prefix}{max(versions, default=-1) + 1}"
          from pathlib import Path
          import os

          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"version={version}\n")
          PYVERSION
      - name: Build distributions
        run: |
          python - <<'PYVERSION'
          from pathlib import Path
          import re

          path = Path("pyproject.toml")
          source = path.read_text()
          version = "${{ steps.version.outputs.version }}"
          updated, count = re.subn(
              r'(?m)^version = "[^"]+"$', f'version = "{version}"', source, count=1
          )
          if count != 1:
              raise SystemExit("Expected exactly one project version")
          path.write_text(updated)
          PYVERSION
          python -m pip install "build>=1.2,<2" "twine>=7,<8"
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mcp-digitalhuman/${{ needs.build.outputs.version }}/
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/
      - name: Publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m pip install "twine>=7,<8"
          twine check dist/*
          twine upload dist/*


  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.21
      PACKAGE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Publish the released PyPI package
        run: |
          jq --arg version "$PACKAGE_VERSION" '.version = $version | .packages[0].version = $version' server.json > server-release.json
          mv server-release.json server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
