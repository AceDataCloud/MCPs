[project]
name = "mcp-digitalhuman"
version = "0.1.0"
description = "MCP server for AceDataCloud Digital Human video, voice, and task APIs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "AceDataCloud", email = "support@acedata.cloud" }]
keywords = ["mcp", "digitalhuman", "video", "voice", "acedatacloud"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "mcp>=1.2.0,<2",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.4.0", "mypy>=1.10.0"]
test = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "pytest-cov>=5.0.0", "respx>=0.21.0"]
release = ["build>=1.2.0", "twine>=5.0.0"]
all = ["mcp-digitalhuman[dev,test,release]"]

[project.scripts]
mcp-digitalhuman = "main:main"

[project.urls]
Homepage = "https://github.com/AceDataCloud/MCPs/tree/main/digitalhuman"
Documentation = "https://docs.acedata.cloud"
Repository = "https://github.com/AceDataCloud/MCPs"
Issues = "https://github.com/AceDataCloud/MCPs/issues"

[build-system]
requires = ["hatchling>=1.21.0,<1.30.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "tools", "prompts", "main.py"]

[tool.hatch.build.targets.sdist]
include = ["core/", "tools/", "prompts/", "tests/", "main.py", "README.md"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-q", "--tb=short", "--strict-markers"]
