name: quality

on:
  pull_request:
  workflow_call:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and quality dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev,test,http,release]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy core tools contracts
      - name: Test with coverage
        run: pytest --cov=core --cov=tools --cov=contracts --cov-report=term-missing --cov-fail-under=73
      - name: Check generated documentation
        run: python scripts/sync_contract_docs.py --check
      - name: Build package
        run: python -m build
