# Generated by scripts/sync_deploy.py; do not edit.
name: deploy
'on':
  push:
    branches:
    - main
    paths-ignore:
    - .gitignore
    - README.md
    - CHANGELOG.md
    - LICENSE
    - .github/ISSUE_TEMPLATE/**
  workflow_dispatch: null
permissions:
  contents: read
  packages: write
concurrency:
  group: production
  queue: max
env:
  BUILD_NUMBER: ${{ github.run_id }}-${{ github.run_attempt }}
jobs:
  run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v6
      with:
        ref: main
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install package and quality dependencies
      run: python -m pip install --upgrade pip && pip install -e ".[dev,test,http,release]"
    - name: Lint
      run: ruff check .
    - name: Format
      run: ruff format --check .
    - name: Type check
      run: mypy core tools contracts
    - name: Test with coverage
      run: pytest --cov=core --cov=tools --cov=contracts --cov-report=term-missing --cov-fail-under=75
    - name: Check generated documentation
      run: python scripts/sync_contract_docs.py --check
    - name: Build package
      run: python -m build
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: Azure/k8s-set-context@v4
      with:
        kubeconfig: ${{ secrets.KUBE_CONFIG }}
    - name: Pass the configured context explicitly
      run: echo "KUBE_CONTEXT=$(kubectl config current-context)" >> "$GITHUB_ENV"
    - name: Build immutable images
      run: docker compose build
    - name: Push images
      run: docker compose push
    - name: Apply resources
      run: sh ./deploy/run.sh
