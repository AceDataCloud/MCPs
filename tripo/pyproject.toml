[project]
name = "mcp-tripo"
version = "2026.11.27.0"
description = "Generate and edit 3D models and animate characters with Tripo on Ace Data Cloud"
readme = "README.pypi.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Ace Data Cloud", email = "support@acedata.cloud"}]
keywords = ["mcp", "tripo", "3d", "animation", "acedatacloud"]
dependencies = [
  "mcp>=1.20,<2", "httpx>=0.27", "python-dotenv>=1", "pydantic>=2",
  "loguru>=0.7", "redis>=5,<7", "cryptography>=42",
]

[project.optional-dependencies]
dev = ["ruff>=0.4", "mypy>=1.10"]
test = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "respx>=0.21"]

[project.scripts]
mcp-tripo = "main:main"

[project.urls]
Homepage = "https://github.com/AceDataCloud/TripoMCP"
Documentation = "https://platform.acedata.cloud/documents/tripo?utm_source=pypi&utm_medium=referral&utm_campaign=evergreen"
Repository = "https://github.com/AceDataCloud/TripoMCP"

[build-system]
requires = ["hatchling>=1.21,<1.30"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "tools", "main.py"]

[tool.hatch.build.targets.sdist]
include = ["core/", "tools/", "tests/", "main.py", "LICENSE", "README.md", "README.pypi.md"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
