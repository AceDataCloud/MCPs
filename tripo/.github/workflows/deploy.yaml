name: deploy
on:
  push:
    branches:
      - main
    paths-ignore:
      - .gitignore
      - README.md
      - CHANGELOG.md
      - LICENSE
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      # A rerun verifies the same image and rollout even when TKE schedules slowly.
      - name: Select deployment image tag
        run: echo "BUILD_NUMBER=$GITHUB_RUN_ID" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@master

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Verify Docker Compose
        run: docker compose version

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Kubectl
        uses: Azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Check for the image from this run
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/acedatacloud/mcp-tripo:${BUILD_NUMBER}"
          if metadata=$(docker buildx imagetools inspect "$image" 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [[ "$metadata" == *"not found"* || "$metadata" == *"manifest unknown"* ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$metadata" >&2
            exit 1
          fi

      - name: Build Docker images
        if: steps.image.outputs.exists == 'false'
        run: docker compose build

      - name: Push Docker images
        if: steps.image.outputs.exists == 'false'
        run: docker compose push

      - name: Deploy
        run: sh ./deploy/run.sh
