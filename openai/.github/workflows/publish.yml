name: Publish to PyPI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_service_plugin:
        description: 'Publish the new service listing only after verifying brand rights and Marketplace requirements'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate date-based version
        id: version
        run: |
          # Version format: YYYY.M.D.BUILD
          DATE_PREFIX=$(date +'%Y.%-m.%-d')

          pip install requests -q
          LATEST_BUILD=$(python -c "
          import requests
          try:
              resp = requests.get('https://pypi.org/pypi/mcp-openai-pro/json', timeout=10)
              if resp.status_code == 200:
                  versions = resp.json().get('releases', {}).keys()
                  today_prefix = '${DATE_PREFIX}'
                  today_versions = [v for v in versions if v.startswith(today_prefix)]
                  if today_versions:
                      builds = []
                      for v in today_versions:
                          parts = v.split('.')
                          if len(parts) == 4:
                              builds.append(int(parts[3]))
                      print(max(builds) + 1 if builds else 0)
                  else:
                      print(0)
              else:
                  print(0)
          except:
              print(0)
          ")

          VERSION="${DATE_PREFIX}.${LATEST_BUILD}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"

      - name: Update version in pyproject.toml
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          python -c "
          import re
          with open('pyproject.toml', 'r') as f:
              content = f.read()
          content = re.sub(r'version = \"[^\"]+\"', f'version = \"$VERSION\"', content, count=1)
          with open('pyproject.toml', 'w') as f:
              f.write(content)
          "
          echo "Updated pyproject.toml to version $VERSION"
          cat pyproject.toml | grep -m1 "version"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mcp-openai-pro/${{ needs.build.outputs.version }}
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          pip install "twine>=5.0,<6.1"
          twine upload dist/*

  create-release:
    name: Create GitHub Release
    if: github.event_name == 'push'
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.build.outputs.version }}" dist/* \
            --title "v${{ needs.build.outputs.version }}" \
            --generate-notes \
            --repo '${{ github.repository }}' || echo "Release already exists, skipping"

  publish-mcp-registry:
    name: Publish to MCP Registry
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Update server.json version
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          python3 -c "
          import json
          with open('server.json', 'r') as f:
              data = json.load(f)
          data['version'] = '$VERSION'
          for pkg in data.get('packages', []):
              pkg['version'] = '$VERSION'
          with open('server.json', 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          "

          python3 - <<'PYPROFILE'
          import json
          from pathlib import Path

          path = Path("gpt-image.server.json")
          data = json.loads(path.read_text())
          version = "${{ needs.build.outputs.version }}"
          data["version"] = version
          for package in data["packages"]:
              package["version"] = version
          path.write_text(json.dumps(data, indent=2) + "\n")
          PYPROFILE

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher publish
          ./mcp-publisher publish gpt-image.server.json

  publish-gpt-image-jetbrains:
    name: Publish JetBrains Plugin
    if: github.event_name == 'workflow_dispatch' && inputs.publish_service_plugin
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Check marketplace status and set package version
        id: jb_version
        env:
          PUBLISH_VERSION: ${{ needs.build.outputs.version }}
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: |
          python3 - <<'PYCODE'
          import json, os, urllib.error, urllib.parse, urllib.request, xml.etree.ElementTree as ET
          xml_id = ET.parse("jetbrains-gpt-image/src/main/resources/META-INF/plugin.xml").getroot().findtext("id")
          query = urllib.parse.urlencode({"family": "intellij", "xmlId": xml_id})
          token = os.environ["PUBLISH_TOKEN"]
          if not token:
              raise SystemExit("JETBRAINS_MARKETPLACE_TOKEN is required")
          headers = {"Accept": "application/json", "Authorization": "Bearer " + token}
          request = urllib.request.Request("https://plugins.jetbrains.com/api/plugins?" + query, headers=headers)
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  plugin = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              plugin = {}
          if plugin.get("isBlocked"):
              raise SystemExit(f"JetBrains blocked {xml_id} (plugin {plugin['id']}); resolve the marketplace review before publishing.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={os.environ['PUBLISH_VERSION']}\nplugin_id={plugin.get('id', '')}\n")
          PYCODE

      - name: Update plugin version
        working-directory: jetbrains-gpt-image
        run: |
          sed -i "s/pluginVersion = .*/pluginVersion = ${{ steps.jb_version.outputs.version }}/" gradle.properties

      - name: Build plugin
        working-directory: jetbrains-gpt-image
        run: ./gradlew buildPlugin

      - name: Publish to JetBrains Marketplace
        working-directory: jetbrains-gpt-image
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "::error::JETBRAINS_MARKETPLACE_TOKEN is required"
            exit 1
          fi
          OUTPUT=$(./gradlew publishPlugin 2>&1) && echo "$OUTPUT" || {
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -q "already contains version"; then
              echo "Version already published, skipping"
              exit 0
            elif echo "$OUTPUT" | grep -q "Cannot find plugin"; then
              echo "Plugin not yet registered, uploading via REST API..."
              PLUGIN_ZIP=$(find build/distributions -name "*.zip" | head -1)
              if [ -z "$PLUGIN_ZIP" ]; then
                echo "ERROR: No plugin ZIP found in build/distributions/"
                exit 1
              fi
              RESPONSE=$(curl -s -w "\n%{http_code}" \
                -H "Authorization: Bearer $PUBLISH_TOKEN" \
                -F "file=@$PLUGIN_ZIP" \
                -F "licenseUrl=https://opensource.org/licenses/MIT" \
                -F "tags=Code tools" \
                -F "vendor=acedatacloud" \
                https://plugins.jetbrains.com/api/plugins/intellij/upload)
              HTTP_CODE=$(echo "$RESPONSE" | tail -1)
              BODY=$(echo "$RESPONSE" | head -n -1)
              echo "Response ($HTTP_CODE): $BODY"
              if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
                echo "Successfully uploaded plugin via REST API"
                exit 0
              else
                echo "REST API upload failed with HTTP $HTTP_CODE"
                exit 1
              fi
            fi
            exit 1
          }

      - name: Verify uploaded version and report approval status
        env:
          PLUGIN_ID: ${{ steps.jb_version.outputs.plugin_id }}
          PUBLISH_VERSION: ${{ steps.jb_version.outputs.version }}
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: |
          python3 - <<'PYCODE'
          import json, os, time, urllib.parse, urllib.request, xml.etree.ElementTree as ET
          headers = {"Accept": "application/json", "Authorization": "Bearer " + os.environ["PUBLISH_TOKEN"]}
          plugin_id = os.environ["PLUGIN_ID"]
          if not plugin_id:
              xml_id = ET.parse("jetbrains-gpt-image/src/main/resources/META-INF/plugin.xml").getroot().findtext("id")
              query = urllib.parse.urlencode({"family": "intellij", "xmlId": xml_id})
              with urllib.request.urlopen(urllib.request.Request("https://plugins.jetbrains.com/api/plugins?" + query, headers=headers), timeout=30) as response:
                  plugin_id = json.load(response)["id"]
          url = f"https://plugins.jetbrains.com/api/plugins/{plugin_id}/updates?channel=&size=20"
          match = None
          for attempt in range(6):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
                  updates = json.load(response)
              match = next((item for item in updates if item["version"] == os.environ["PUBLISH_VERSION"]), None)
              if match:
                  break
              if attempt < 5:
                  time.sleep(5)
          if match is None:
              raise SystemExit("Uploaded JetBrains version could not be read back")
          status = "approved" if match.get("approve") else "awaiting JetBrains approval"
          if not match.get("approve"):
              print(f"::warning::Version {os.environ['PUBLISH_VERSION']} is uploaded but {status}; it is not publicly installable yet.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"JetBrains {os.environ['PUBLISH_VERSION']}: **{status}**.\n")
          PYCODE
