name: deploy
'on':
  push:
    branches: [main]
    paths-ignore:
      - .gitignore
      - README.md
      - CHANGELOG.md
      - LICENSE
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
# The lock covers checkout, quality checks, build and apply of one main snapshot.
concurrency:
  group: production
  queue: max
env:
  BUILD_NUMBER: ${{ github.run_id }}-${{ github.run_attempt }}
jobs:
  run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install '.[test]'
      - name: Test
        run: pytest
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: Azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: Pass the configured context explicitly
        run: echo "KUBE_CONTEXT=$(kubectl config current-context)" >> "$GITHUB_ENV"
      - name: Build immutable images
        run: docker compose build
      - name: Push images
        run: docker compose push
      - name: Apply resources
        run: sh ./deploy/run.sh
