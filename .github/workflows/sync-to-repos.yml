name: Sync to Sub-Repos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Reconcile a fixed current-main snapshot after acquiring the mirror lock.
# Full mapping reconciliation catches changes from every queued push.
concurrency:
  group: standalone-source-sync
  queue: max

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN || secrets.BOT_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML
      - run: gh auth setup-git
      - name: Reconcile configured repositories
        run: python3 scripts/sync_to_repos.py
