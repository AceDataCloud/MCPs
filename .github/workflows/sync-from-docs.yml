name: Sync from Docs

on:
  repository_dispatch:
    types: [docs-updated]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  create-task:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      issue_number: ${{ steps.create-issue.outputs.issue_number }}
    steps:
      - name: Validate sync token
        env:
          SYNC_GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN || secrets.BOT_GITHUB_TOKEN }}
        run: |
          if [ -z "$SYNC_GH_TOKEN" ]; then
            echo "::error::Missing GitHub token. Set ADMIN_GITHUB_TOKEN or BOT_GITHUB_TOKEN."
            exit 1
          fi

      - name: Checkout Docs
        uses: actions/checkout@v6
        with:
          repository: AceDataCloud/Docs
          path: _docs
          token: ${{ secrets.ADMIN_GITHUB_TOKEN || secrets.BOT_GITHUB_TOKEN }}
          fetch-depth: 5

      - name: Get Docs changes
        id: docs
        run: |
          cd _docs
          commit_info=$(git log -1 --pretty=format:"%h %s" 2>/dev/null || echo "unknown")
          echo "commit_info=$commit_info" >> "$GITHUB_OUTPUT"

          recent_changes=$(git log --oneline -5 2>/dev/null || echo "unknown")
          echo "recent_changes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$recent_changes" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          changed_services="${{ github.event.client_payload.changed_services }}"
          if [ -z "$changed_services" ]; then
            changed_services="all"
          fi
          echo "changed_services=$changed_services" >> "$GITHUB_OUTPUT"

      - name: Close existing sync issues
        env:
          GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN || secrets.BOT_GITHUB_TOKEN }}
        run: |
          gh issue list --repo "${{ github.repository }}" --label "auto-sync" --state open --json number --jq '.[].number' | while read -r num; do
            gh issue close "$num" --repo "${{ github.repository }}" --comment "Superseded by new sync trigger." 2>/dev/null || true
          done

      - name: Create issue for Copilot
        id: create-issue
        env:
          GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN || secrets.BOT_GITHUB_TOKEN }}
          COMMIT_INFO: ${{ steps.docs.outputs.commit_info }}
          RECENT_CHANGES: ${{ steps.docs.outputs.recent_changes }}
          CHANGED_SERVICES: ${{ steps.docs.outputs.changed_services }}
          REPO: ${{ github.repository }}
        run: |
          body=$(jq -n \
            --arg changes "$RECENT_CHANGES" \
            --arg services "$CHANGED_SERVICES" \
            '"The upstream Docs have been updated. Ensure the affected MCP servers in this monorepo are in sync.\n\n## Changed Services\n\n`" + $services + "`\n\n## Recent Docs Changes\n\n```\n" + $changes + "\n```\n\n## Instructions\n\nSee `.github/copilot-instructions.md` for sync rules.\n\nThis is a monorepo with MCP servers in subdirectories (luma/, suno/, midjourney/, etc.).\n\nCheck the AceDataCloud/Docs repo OpenAPI specs at `openapi/<service>.json` for each changed service.\n\nCompare models, endpoints, and parameters against the corresponding subdirectory'\''s code. Fix any differences.\n\nOnly modify subdirectories matching the changed services. If everything is already in sync, close this issue."')

          ISSUE_JSON=$(jq -n \
            --arg title "sync: update from Docs ($COMMIT_INFO)" \
            --argjson body "$body" \
            '{title: $title, body: $body, labels: ["auto-sync"]}' \
            | gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              /repos/"$REPO"/issues \
              --input -)
          ISSUE_NUM=$(echo "$ISSUE_JSON" | jq -r '.number')
          ISSUE_NODE=$(echo "$ISSUE_JSON" | jq -r '.node_id')
          echo "Created issue #$ISSUE_NUM (node=$ISSUE_NODE)"

          OWNER="${REPO%/*}"
          NAME="${REPO#*/}"
          COPILOT_ID=$(gh api graphql \
            -f query='query($owner:String!,$name:String!){ repository(owner:$owner,name:$name){ suggestedActors(capabilities:[CAN_BE_ASSIGNED], first:50){ nodes { __typename ... on Bot { login id } ... on User { login id } } } } }' \
            -f owner="$OWNER" -f name="$NAME" \
            --jq '[.data.repository.suggestedActors.nodes[] | select(.login=="copilot-swe-agent" or .login=="Copilot")] | .[0].id // empty')

          if [ -z "$COPILOT_ID" ]; then
            echo "::error::Copilot not found in suggestedActors. ADMIN_GITHUB_TOKEN must belong to a user with a Copilot seat in this org."
            gh issue comment "$ISSUE_NUM" --repo "$REPO" --body "Auto-assignment failed: Copilot not visible to ADMIN_GITHUB_TOKEN. Please assign Copilot manually." || true
            exit 1
          fi

          gh api graphql \
            -f query='mutation($a:ID!,$b:[ID!]!){ replaceActorsForAssignable(input:{assignableId:$a, actorIds:$b}){ assignable { ... on Issue { number assignees(first:5){ nodes { login } } } } } }' \
            -f a="$ISSUE_NODE" -f b="$COPILOT_ID"

          echo "issue_number=$ISSUE_NUM" >> "$GITHUB_OUTPUT"

  wait-and-merge:
    needs: create-task
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate sync token
        env:
          SYNC_GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN || secrets.BOT_GITHUB_TOKEN }}
        run: |
          if [ -z "$SYNC_GH_TOKEN" ]; then
            echo "::error::Missing GitHub token. Set ADMIN_GITHUB_TOKEN or BOT_GITHUB_TOKEN."
            exit 1
          fi

      - name: Wait for Copilot PR and merge
        env:
          GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN || secrets.BOT_GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ needs.create-task.outputs.issue_number }}
        run: |
          echo "Waiting for Copilot to process issue #$ISSUE_NUMBER..."

          for i in $(seq 1 90); do
            echo "Poll attempt $i/90..."

            ISSUE_STATE=$(gh issue view "$ISSUE_NUMBER" --repo "${{ github.repository }}" --json state --jq '.state')
            if [ "$ISSUE_STATE" = "CLOSED" ]; then
              echo "Issue #$ISSUE_NUMBER was closed — Copilot determined no changes needed."
              exit 0
            fi

            PR_JSON=$(gh api graphql \
              -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){issue(number:$number){closedByPullRequestsReferences(first:20){nodes{number title state headRefName headRefOid}}}}}' \
              -f owner='${{ github.repository_owner }}' \
              -f name='${{ github.event.repository.name }}' \
              -F number="$ISSUE_NUMBER" \
              --jq '[.data.repository.issue.closedByPullRequestsReferences.nodes[] | select(.state == "OPEN") | select(.headRefName | startswith("copilot/"))] | .[0] // empty')

            if [ -n "$PR_JSON" ]; then
              PR_NUMBER=$(echo "$PR_JSON" | jq -r '.number')
              PR_TITLE=$(echo "$PR_JSON" | jq -r '.title')
              HEAD_BRANCH=$(echo "$PR_JSON" | jq -r '.headRefName')
              echo "Found PR #$PR_NUMBER: $PR_TITLE (branch=$HEAD_BRANCH)"

              AGENT_RUN=$(gh api "/repos/${{ github.repository }}/actions/runs?branch=$HEAD_BRANCH&event=dynamic" \
                --jq '[.workflow_runs[] | {name: .name, status: .status, conclusion: (.conclusion // ""), created_at: .created_at}] | sort_by(.created_at) | reverse | .[0] // empty' 2>/dev/null || echo "")

              if [ -n "$AGENT_RUN" ]; then
                AGENT_NAME=$(echo "$AGENT_RUN" | jq -r '.name')
                AGENT_PHASE=$(echo "$AGENT_RUN" | jq -r '.status')
                AGENT_STATUS=$(echo "$AGENT_RUN" | jq -r 'if .status == "completed" then (.conclusion // "failure") else "pending" end')
                echo "Latest dynamic run: $AGENT_NAME (phase=$AGENT_PHASE, conclusion=$AGENT_STATUS)"
              else
                AGENT_STATUS="pending"
                echo "No dynamic workflow run found yet for branch $HEAD_BRANCH"
              fi

              if [ "$AGENT_STATUS" = "success" ]; then
                echo "Copilot agent completed. Validating its final head before merge..."
                gh pr ready "$PR_NUMBER" --repo "${{ github.repository }}" 2>/dev/null || true
                PR_HEAD=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefOid --jq '.headRefOid')
                cp scripts/check_mcp_tool_parameter_aliases.py /tmp/check_mcp_tool_parameter_aliases.py
                git fetch origin "$HEAD_BRANCH"
                git checkout --detach "$PR_HEAD"
                MCP_ROOT="$GITHUB_WORKSPACE" python3 /tmp/check_mcp_tool_parameter_aliases.py

                CI_STATUS=""
                for check_attempt in $(seq 1 60); do
                  CI_STATUS=$(gh api "/repos/${{ github.repository }}/actions/workflows/ci.yaml/runs?event=pull_request&head_sha=$PR_HEAD&per_page=1" \
                    --jq '.workflow_runs[0] | if .status == "completed" then (.conclusion // "failure") else (.status // "") end')
                  if [ "$CI_STATUS" = "success" ]; then
                    break
                  fi
                  if [ -n "$CI_STATUS" ] && [ "$CI_STATUS" != "queued" ] && [ "$CI_STATUS" != "in_progress" ] && [ "$CI_STATUS" != "waiting" ] && [ "$CI_STATUS" != "pending" ]; then
                    echo "CI failed for $PR_HEAD with status: $CI_STATUS"
                    exit 1
                  fi
                  echo "Waiting for CI on $PR_HEAD ($check_attempt/60, status=${CI_STATUS:-not registered})..."
                  sleep 10
                done
                if [ "$CI_STATUS" != "success" ]; then
                  echo "Timed out waiting for CI on $PR_HEAD."
                  exit 1
                fi

                FINAL_PR=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json state,headRefOid)
                FINAL_STATE=$(echo "$FINAL_PR" | jq -r '.state')
                FINAL_HEAD=$(echo "$FINAL_PR" | jq -r '.headRefOid')
                if [ "$FINAL_STATE" != "OPEN" ] || [ "$FINAL_HEAD" != "$PR_HEAD" ]; then
                  echo "PR state or head changed during validation; retrying."
                  git checkout --detach "${{ github.sha }}"
                  sleep 20
                  continue
                fi
                gh pr merge "$PR_NUMBER" --repo "${{ github.repository }}" --squash \
                  --admin --match-head-commit "$PR_HEAD" \
                  --subject "sync: update from Docs [automated]"
                echo "PR #$PR_NUMBER merged successfully!"
                exit 0
              elif [ "$AGENT_STATUS" = "failure" ]; then
                echo "Copilot agent failed. Manual intervention needed."
                exit 1
              else
                echo "Copilot still working... waiting 20s"
              fi
            fi

            sleep 20
          done

          echo "Timeout: No PR found after 30 minutes."
          echo "Check issue #$ISSUE_NUMBER for status."
          exit 1
